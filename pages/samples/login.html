<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Campus Event System</title>

  <!-- plugins:css -->
  <link rel="stylesheet" href="../../vendors/simple-line-icons/css/simple-line-icons.css">
  <link rel="stylesheet" href="../../vendors/flag-icon-css/css/flag-icon.min.css">
  <link rel="stylesheet" href="../../vendors/css/vendor.bundle.base.css">

  <!-- Layout styles -->
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="shortcut icon" href="../../images/favicon.png" />
</head>

<body>
  <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-center auth">
        <div class="row flex-grow">
          <div class="col-lg-4 mx-auto">
            <div class="auth-form-light text-left p-5">

              <div class="brand-logo">
                <img src="../../images/logo.svg">
              </div>

              <h4>Hello! Let's get started</h4>
              <h6 class="font-weight-light">Sign in to continue.</h6>

              <!-- LOGIN FORM -->
              <form class="pt-3" method="POST" action="login_process.php">

                <!-- Role Dropdown -->
                <div class="form-group">
                  <select name="role" class="form-control form-control-lg" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="student">Student</option>
                    <option value="organizer">Event Organizer</option>
                  </select>
                </div>

                <!-- Email -->
                <div class="form-group">
                  <input type="email" name="email" class="form-control form-control-lg" placeholder="Email" required>
                </div>

                <!-- Password -->
                <div class="form-group">
                  <input type="password" name="password" class="form-control form-control-lg" placeholder="Password"
                    required>
                </div>

                <!-- Submit Button -->
                <div class="mt-3">
                  <button type="submit" class="btn btn-block btn-primary btn-lg font-weight-medium">
                    SIGN IN
                  </button>
                </div>

                <!-- Remember + Forgot -->
                <div class="my-2 d-flex justify-content-between align-items-center">
                  <div class="form-check">
                    <label class="form-check-label text-muted">
                      <input type="checkbox" name="remember" class="form-check-input">
                      Keep me signed in
                    </label>
                  </div>
                  <a href="#" class="auth-link text-black">Forgot password?</a>
                </div>

                <!-- Register Link -->
                <div class="text-center mt-4 font-weight-light">
                  Don't have an account?
                </div>

                <div class="text-center mt-2">
                  <div class="dropdown">
                    <button class="btn btn-primary dropdown-toggle" data-toggle="dropdown">
                      Create Account
                    </button>
                    <div class="dropdown-menu">
                      <a class="dropdown-item" href="studentRegister.html">Student</a>
                      <a class="dropdown-item" href="eventOrganizerRegisteration.html">Event Organizer</a>
                    </div>
                  </div>
                </div>

              </form>
              <!-- END FORM -->

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- scripts -->
  <script src="../../vendors/js/vendor.bundle.base.js"></script>
  <script src="../../js/off-canvas.js"></script>
  <script src="../../js/misc.js"></script>

</body>

</html>
